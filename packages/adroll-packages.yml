note: >-
  NextRoll ships NO first-party client library for the AdRoll / NextRoll API in
  any package registry. This was checked, not assumed: npm registry search for
  "adroll" returns only third-party packages (angulartics-adroll, react-adroll —
  both community-maintained, last published 2018-2019), npm search for
  "nextroll" returns zero results, and pypi.org/pypi/adroll, pypi.org/pypi/
  nextroll and rubygems.org/api/v1/gems/adroll all 404. The scoped names an
  official SDK would plausibly occupy — @adroll/sdk, @adroll/mcp, @nextroll/mcp,
  adroll-mcp, adroll-api — are all unregistered. The 69-repo AdRoll GitHub
  organisation is real and active but publishes infrastructure and Erlang/Go OSS
  (erlcloud, kinetic, baker, rebar3 plugins), not API clients. The docs teach
  integration with generic HTTP tooling instead: cURL, Python `requests`, PHP
  cURL and node-fetch code samples on the Get Started guide.

