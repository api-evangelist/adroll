gap: >-
  A developer integrating AdRoll writes their own HTTP client, handles the
  two-credential scheme (Authorization header + apikey query parameter) by hand,
  and has no typed model for the 107-type GraphQL reporting schema. A first-party
  SDK in even one language would be the single highest-leverage ergonomics
  improvement available to this API.

