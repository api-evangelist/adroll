generated: '2026-08-13'
method: derived
source: >-
  mcp/adroll-mcp.yml (probed), graphql/adroll-reporting.graphql (derived from the
  published schema reference), and the NextRoll REST reference pages at
  https://apidocs.nextroll.com/
note: >-
  AdRoll runs three overlapping-but-non-identical surfaces: a REST API family
  (CRUD, Audience, Prospecting, User Lists, Geotargeting, Server-to-Server), a
  GraphQL Reporting API, and — since 2026-05-27 — a remote MCP server. This
  crosswalk records the surfaces and the divergence between them. It contains NO
  tool bindings, and that is the finding, not an omission: the MCP tool manifest
  is auth-gated (tools/list -> HTTP 401 invalid_token) and NextRoll publishes no
  tool list anywhere, so there are no tool NAMES to bind. Mapping AdRoll's six
  marketing capability claims onto operationIds would be invention, so the
  crosswalk[] array is deliberately empty until an authenticated tools/list can
  be captured.

surfaces:
  rest:
    openapi: null
    note: >-
      NextRoll publishes no OpenAPI file. Its reference pages are BUILT from
      OpenAPI/Swagger documents — the Sphinx sources carry directives such as
      `.. openapi:spec:: ../apispecs/adroll.json` and
      `.. openapi:spec:: ../apispecs/audience.json` — but those apispecs/*.json
      inputs are not copied into the published site (HTTP 404 at every
      apispecs/ path probed). The specs exist; they are simply unpublished.
    reference: https://apidocs.nextroll.com/index.html
    base_url: https://services.adroll.com
    operations_documented: 176
    gated: false
  graphql:
    endpoint: https://services.adroll.com/reporting/api/v1/query
    schema: graphql/adroll-reporting.graphql
    published_schema_reference: https://apidocs.nextroll.com/graphql-reporting-api/schema.html
    console: https://app.adroll.com/reporting/graphiql
    types: 107
    fields: 1710
    gated: true
    gated_note: >-
      Anonymous introspection returns HTTP 401
      {"code":"apiproxy:3","message":"Missing 'apikey' query parameter"}.
      The SDL in graphql/ is transcribed from the published schema reference,
      not from an introspection response.
  mcp:
    url: https://services.adroll.com/mcp
    gated: true
    gated_note: 'tools/list -> HTTP 401, WWW-Authenticate: Bearer realm="mcp", error="invalid_token"'

crosswalk: []

mcp_only: []

mcp_unbound:
- capability: reporting
  reason: >-
    AdRoll claims "retrieve campaign performance and reporting data" for MCP. The
    backing surface is almost certainly the GraphQL Reporting API
    (POST /reporting/api/v1/query) and/or GET /api/v1/report/{advertisable,campaign,ad},
    but with no tool names published this cannot be asserted as a binding.
- capability: campaign-creation
  reason: >-
    "Create new campaign drafts" plausibly backs onto POST /api/v1/campaign/create
    and POST /prospecting/api/v2/advertisables/(adv)/campaigns. Unverifiable while
    tools/list is gated.
- capability: abm-account-intelligence
  reason: >-
    "Surface AdRoll ABM account intelligence" plausibly backs onto the Audience
    API target-accounts and ideal_customer_profile families. Unverifiable while
    tools/list is gated.

graphql_only:
- root: Query.organization / advertisable / campaign / adgroup / ad / automation / email / segment / group / log
  reason: >-
    The GraphQL Reporting API replaces the /report endpoints of the CRUD API and
    the /report and /metrics endpoints of the Prospecting API, and exposes
    metric shapes (reach/frequency, brand awareness, CTV household, contextual
    keyword/topic targeting, UTM-based conversions, placement and domain
    breakdowns) that have no REST equivalent at all.
  source: https://apidocs.nextroll.com/graphql-reporting-api/overview.html

