  checked: '2026-08-13'
  probes:
  - {url: 'https://services.adroll.com/reporting/api/v1/query', http_status: 401, body: "apiproxy:3 Missing 'apikey' query parameter"}
  - {url: 'https://services.adroll.com/.well-known/oauth-authorization-server', http_status: 200}
