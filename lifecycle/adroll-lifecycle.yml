generated: '2026-08-13'
method: searched
source: https://apidocs.nextroll.com/index.html
note: >-
  Versioning, retirement and status posture for the NextRoll API family, read
  from the published docs and the live Statuspage. No deprecated-operation list
  can be derived from a spec because NextRoll publishes no OpenAPI.

versioning:
  scheme: uri-path
  note: >-
    The version sits in the path and is per-service rather than platform-wide:
    /api/v1 (CRUD), /audience/v1, /prospecting/api/v2, /user-lists/api/v1,
    /geo/api/search/v2, /reporting/api/v1. There is no version header, no date
    pinning and no published version-support policy.
  current:
    crud: v1
    audience: v1
    prospecting: v2
    user-lists: v1
    geotargeting: v2
    reporting-graphql: v1
  graphql_note: >-
    The GraphQL Reporting API's own overview cites "evolve without API versions"
    as a benefit of GraphQL; every response carries a `version` build string
    (e.g. "2018.09.11-1") for support purposes, not for client pinning.
  docs: https://apidocs.nextroll.com/index.html

deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  rfc8594: false
  note: >-
    NextRoll announces retirements in the docs as warning banners on the affected
    service pages, with a month-and-year date and no migration deadline
    mechanics. There is no written deprecation policy, no notice period
    commitment, and no Sunset/Deprecation response headers.
  announced_retirements:
  - api: Automated Campaigns API
    status: retired
    announced_date: April 2025
    statement: 'The Automated Campaigns API will be retired April 2025.'
    docs: https://apidocs.nextroll.com/automated-campaigns-api/overview.html
    note: >-
      The retirement date has passed but the reference pages remain published
      with the warning banner in place, so the docs do not say whether the
      endpoints are actually gone.
  - api: Universal Campaigns API
    status: retired
    announced_date: April 2025
    statement: 'The Universal Campaigns API will be retired April 2025.'
    docs: https://apidocs.nextroll.com/universal-campaigns-api/overview.html
  deprecated_parameters:
  - parameter: display_url_override
    scope: web campaigns
    statement: 'For web campaigns, display_url_override parameter is deprecated.'
    docs: https://apidocs.nextroll.com/faq.html

beta_surfaces:
- api: Server-to-Server (S2S) Event API
  statement: >-
