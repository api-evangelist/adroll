- aid: adroll:nextroll-s2s
  name: NextRoll Server-to-Server (S2S) Event API
  description: Server-side event ingestion API for sending user events and conversions
    to AdRoll directly from your own servers, complementing the AdRoll pixel and mobile
    measurement partner integrations. Accepts batched JSON events keyed by an AdRoll
    click ID or first-party cookie, with hashed email, device and user identifiers,
    covering both B2C events (page view, product search, add to cart, purchase) and
    B2B/ABM events (high-value page, gated content, demo request, form fill). Supports
    a dry_run validation mode and gzip compression.
  humanURL: https://apidocs.nextroll.com/server-to-server-api/overview.html
  baseURL: https://srv.adroll.com/api
