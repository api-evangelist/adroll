- aid: adroll:nextroll-graphql-reporting
  name: NextRoll GraphQL Reporting API
  description: GraphQL API for retrieving all AdRoll and AdRoll ABM reporting data
    in a single request — organization, advertisable, campaign, adgroup, ad, audience,
    email and automation metrics, plus conversions, reach and frequency, brand awareness,
    CTV household, contextual targeting and UTM-based attribution. It replaces the
    /report endpoints of the CRUD API and the /report and /metrics endpoints of the
    Prospecting API. 107 types and 1,710 fields are documented in the published schema
    reference; live introspection is authenticated.
  humanURL: https://apidocs.nextroll.com/graphql-reporting-api/overview.html
  baseURL: https://services.adroll.com/reporting/api/v1/query
