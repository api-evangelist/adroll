- aid: adroll:nextroll-mcp
  name: AdRoll MCP Server
  description: Remote Model Context Protocol server that exposes AdRoll and AdRoll
    ABM data and supported workflows to MCP-compatible AI clients including Claude,
    ChatGPT, Cursor, n8n and Microsoft Copilot Studio. Launched in open beta on 27
    May 2026. Covers campaign performance retrieval, trend summarisation, campaign
    draft creation with draft-first human review, and ABM account intelligence. Authorization
    is OAuth 2.1 with dynamic client registration and PKCE, published as RFC 8414
    and RFC 9728 metadata documents; the live tools/list manifest is authenticated.
  humanURL: https://www.adroll.com/blog/adroll-mcp-server
  baseURL: https://services.adroll.com/mcp
  tags:
